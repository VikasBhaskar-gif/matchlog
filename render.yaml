services:
  - type: web
    name: matchlog
    runtime: node
    plan: free
    region: frankfurt
    autoDeploy: true
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: FOOTBALL_DATA_API_TOKEN
        value: f9a102dabf644881bbdff8c52f74a3cb
      - key: DATABASE_URL
        fromDatabase:
          name: matchlog-db
          property: connectionString

databases:
  - name: matchlog-db
    plan: free
    region: frankfurt
    databaseName: matchlog
    user: matchlog
